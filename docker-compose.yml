services:
  mysql:
    image: mysql:8.0
    container_name: news-ai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: news_ai
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: news-ai-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD:-change-me}@mysql:3306/news_ai?charset=utf8mb4
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      HF_ENDPOINT: https://hf-mirror.com
      RSS_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/app/.cache

volumes:
  mysql_data:
  model_cache:
